name: Build Linux AppImage

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality gates
        run: npm run check

      - name: Audit runtime and tooling dependencies
        run: npm run audit:ci

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Run browser end-to-end tests
        run: npm run test:e2e

      - name: Run Electron end-to-end tests
        run: xvfb-run -a npm run test:e2e:electron

  appimage:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build AppImage
        run: npm run electron:build:appimage

      - name: Smoke-test AppImage under Xvfb
        run: |
          artifact="$(find dist-electron -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$artifact"
          chmod +x "$artifact"
          set +e
          timeout 15s xvfb-run -a "$artifact" --appimage-extract-and-run
          status=$?
          set -e
          test "$status" -eq 124

      - name: Verify AppImage artifact
        run: |
          ls -lh dist-electron
          ls -lh dist-electron/*.AppImage
          file dist-electron/*.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: layox-appimage
          path: |
            dist-electron/*.AppImage
            dist-electron/latest-linux.yml
          if-no-files-found: error
